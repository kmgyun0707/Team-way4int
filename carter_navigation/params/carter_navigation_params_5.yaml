bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

velocity_smoother: # Velocity Smoother 목적: 로봇의 속도 신호를 부드럽게 조절
  ros__parameters: 
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP" 
    max_velocity: [0.8, 0.0, 0.7] 
    min_velocity: [-0.8, 0.0, -0.7] 
    # deadband_velocity: [0.0, 0.0, 0.0] 
    velocity_timeout: 1.0 
    # max_accel: [1.0, 0.0, 1.25] 
    # max_decel: [-1.0, 0.0, -1.25] 
    odom_topic: "chassis/odom" 
    odom_duration: 0.1

controller_server: # Controller Server 목적: 로봇의 경로 추적 및 제어
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.01 #수정2 0.001 -> 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    # Goal checker parameters
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.30 # 0.25 -> 0.30
      yaw_goal_tolerance: 0.30 # 0.25 -> 0.30
      stateful: True
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.05
      min_vel_y: 0.0
      max_vel_x: 0.8
      max_vel_y: 0.0
      max_vel_theta: 0.7
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.2 # 수정2 0.0 -> 0.2 
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5 #수정2 3.2 -> 1.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20      # 80 ->  20
      vy_samples: 5
      vtheta_samples: 40   # 80 -> 40
      sim_time: 1.5    # 2.0 -> 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.3 # 허용 범위
      trans_stopped_velocity: 0.3 #멈춤 으로 인정해주는 속도기준치
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.0
      PathAlign.scale: 5.0 #수정3 40.0 -> 5.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 10.0 #수정3 40.0 -> 10.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 10.0 #수정 3 32.0 -> 10.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap: # Local Costmap 목적: 로봇 주변의 장애물 정보를 실시간으로 반영하는 비용 지도
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # 5 -> 10 # 라이다가 보통 10~30Hz 이므로 10Hz 로 설정
      publish_frequency: 6.0
      footprint_padding: 0.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      plugins: ["hesai_voxel_layer", "front_rplidar_obstacle_layer", "back_rplidar_obstacle_layer", "inflation_layer"]
      # plugins: ["hesai_voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 8.0 # 5 -> 8 높을수록 바로 옆도 안전하다고 판단. 
        inflation_radius: 0.2 # 0.5 -> 0.2
      hesai_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False # 3D 라이더 저장소 장애물 인식 비활성화 포인트 클라우드 안씀 
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        publish_voxel_map: False
        origin_z: 0.0
        z_voxels: 2 # 16 -> 4 -> 2 3d lidar 데이터를 처리하는 연산량
        z_resolution: 0.05 # 0.2 -> 0.05
        unknown_threshold: 15
        # observation_sources: pointcloud
        # pointcloud:  # no frame set, uses frame from message
        #   topic: /front_3d_lidar/lidar_points
        #   max_obstacle_height: 1.0 # 2 -> 1.0
        #   min_obstacle_height: 0.35
        #   obstacle_max_range: 10.0 #장애물 최대 인식 거리, 10m 까지를 장애물로 인식
        #   obstacle_min_range: 0.0
        #   raytrace_max_range: 12.0 #
        #   raytrace_min_range: 0.0
        #   clearing: True
        #   marking: True
        #   data_type: "PointCloud2"
      front_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /front_2d_lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          reliability: "reliable" #QOS 설정 추가
          obstacle_min_range: 0.4 #추가
          obstacle_max_range: 0.4 #추가
      back_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: False # 뒷 라이더 저장소 장애물 인식 비활성화
        observation_sources: scan
        scan:
          topic: /back_2d_lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap: # Global Costmap 목적: 전체 환경의 장애물 정보를 반영하는 비용 지도
  global_costmap:
    ros__parameters:
      footprint_padding: 0.0
      update_frequency: 1.0  #
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      # rolling_window: True
      # width: 200
      # height: 200
      resolution: 0.05
      # origin_x: -100.0
      # origin_y: -100.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /front_2d_lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.4
          obstacle_max_range: 10.0
          obstacle_min_range: 0.4
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0 
        inflation_radius: 0.6 
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server: # Map Server 목적: 로봇이 사용할 지도 데이터를 제공
  ros__parameters:
    use_sim_time: True
    yaml_filename: "carter_warehouse_navigation.yaml"

map_saver: # Map Saver 목적: 로봇이 탐색한 지도를 저장
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server: # Planner Server 목적: 로봇의 경로 계획
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server: # Smoother Server 목적: 경로의 부드러운 조정
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server: # Behavior Server 목적: 로봇의 행동 제어
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher: # Robot State Publisher 목적: 로봇의 상태 정보를 퍼블리시
  ros__parameters:
    use_sim_time: True

waypoint_follower: # Waypoint Follower 목적: 미리 정의된 웨이포인트를 따라 로봇을 이동
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 500


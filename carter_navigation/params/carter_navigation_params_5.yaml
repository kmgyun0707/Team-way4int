# nova_carter Navigation Parameters File
#시나리오1 : navigation에 사용한 파일 
amcl: # Adaptive Monte Carlo Localization 목적: 로봇의 위치 추정
  ros__parameters:
    use_sim_time: True
    alpha1: 0.3 # 모션 모델의 불확실성 파라미터 회전할 때 회전 오차 로봇이 제자리 회전할 때 오차가 크면 증가
    alpha2: 0.2 # 모션 모델의 불확실성 파라미터 직진 주행 중 좌우로 흔들리면 증가
    alpha3: 0.3 # 모션 모델의 불확실성 파라미터 직진할 때 직진 오차  직진 주행 시 이동 거리 오차가 크면 증가
    alpha4: 0.3 # 모션 모델의 불확실성 파라미터 회전할 때 직진 오차 회전 시 원치 않는 전진/후진 발생 시 증가
    alpha5: 0.2 # 모션 모델의 불확실성 파라미터 일반적인 2륜 차동 로봇에서는 잘 안 쓰임 전방향 모델용
    base_frame_id: "base_link" 
    beam_skip_distance: 0.5 # 빔 스킵 거리 설정
    beam_skip_error_threshold: 0.9 # 빔 스킵 오류 임계값 설정
    beam_skip_threshold: 0.3 # 빔 스킵 임계값 설정
    do_beamskip: false # 빔 스킵 사용 여부
    global_frame_id: "map"
    lambda_short: 0.1 # 짧은 거리 측정에 대한 가중치
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0 # 100 -> 80 -> 30
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120 # 360 -> 240 -> 120 높으면 cpu 부하 증가
    max_particles: 1200 # 2000 -> 1200
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0  # 
    recovery_alpha_slow: 0.0  
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel" 
    save_pose_rate: 0.5
    sigma_hit: 0.5      # 라이다 신뢰도 노이즈값. 
    tf_broadcast: true
    transform_tolerance: 1.0 
    update_min_a: 0.1   # 0.2 -> 0.1로봇이 라디안만큼 이동해야 필터 업데이트
    update_min_d: 0.12  # 0.25 -> 0.12로봇이 distance 만큼 이동해야 필터 업데이트
    z_hit: 0.5          # 실제 거리 측정에 대한 가중치
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /front_2d_lidar/scan #san -> /front_2d_lidar/scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose: # 초기 위치 설정
      x: 10.0
      y: 18.0
      z: 0.0
      yaw: 3.14159 

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True
